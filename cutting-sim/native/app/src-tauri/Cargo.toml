[package]
name = "cutting-sim-app"
version = "0.1.0"
edition = "2021"
description = "Cutting simulator desktop app: the page of cutting-sim with the native SPH core"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
rayon = "1"
sph-core = { path = "../../sph-core", features = ["gpu"] }

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
panic = "abort"
strip = true
